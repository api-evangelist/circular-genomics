aid: circular-genomics
name: Circular Genomics
description: 'Circular Genomics is a San Diego, California precision-neurology diagnostics
  company that uses brain-derived circular RNA (circRNA) as a class of stable, blood-based
  biomarkers for psychiatric and neurological disease. Spun out of the University of
  New Mexico in 2021 and now resident at Lilly Gateway Labs in San Diego, the company
  builds CircPath, a proprietary molecular-intelligence platform that discovers, validates
  and translates circRNA signals into biological insight, and productizes it as research
  and clinical assays: Discover 1600+ (whole-transcriptome circRNA sequencing across
  1,600+ brain-derived circRNAs with pathway-level analysis), AD Predict and AD Detect
  for Alzheimer''s disease, and MindLight, an SSRI antidepressant response test for
  major depressive disorder. Test ordering and results delivery for licensed healthcare
  providers run through a login-gated provider portal at mindlight.circulargenomics.com,
  which is a white-labeled CrelioHealth laboratory information system rather than a
  first-party developer surface. Circular Genomics publishes no public API, SDK, webhook
  or developer documentation of any kind.'
